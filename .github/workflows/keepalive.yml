name: keepalive
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: curl --fail --silent --show-error --max-time 30 "$SITE_URL/api/health"
