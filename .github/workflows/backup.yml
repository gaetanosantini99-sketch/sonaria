name: backup
permissions:
  contents: read
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: sudo apt-get update && sudo apt-get install -y age
      - name: Dump cifrato
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
        run: |
          supabase db dump --db-url "$DB_URL" -f roles.sql --role-only
          supabase db dump --db-url "$DB_URL" -f schema.sql
          supabase db dump --db-url "$DB_URL" -f data.sql --use-copy --data-only --schema public
          test -s data.sql
          tar czf backup.tgz roles.sql schema.sql data.sql
          age -r "$AGE_RECIPIENT" -o backup.tgz.age backup.tgz
          rm backup.tgz roles.sql schema.sql data.sql
      - uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: backup.tgz.age
          retention-days: 90
